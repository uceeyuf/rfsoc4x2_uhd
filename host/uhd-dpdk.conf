; UHD configuration for DPDK streaming to the RFSoC 4x2 over 100 GbE.
; Use it with UHD_CONFIG_FILE=<this file> and the device args
;   addr=192.168.10.2,mgmt_addr=192.168.30.2,use_dpdk=1
; (8016-byte frames, 1984 samples per packet.) As root, e.g.
;   sudo env UHD_CONFIG_FILE=... LD_LIBRARY_PATH=<uhd>/lib:<dpdk>/lib \
;     benchmark_rate --args "..." --rx_rate 500e6 --rx_channels 0,4 \
;     --tx_rate 500e6 --tx_channels 0,4
; Measured (2026-10-12): 2 x RX + 2 x TX at 500 MS/s, one I/O lcore: no
; drops, no overruns, 6 underruns at the start of the TX stream.
; Data: QSFP28 (host ConnectX-4, DPDK mlx5 PMD) 192.168.10.1 <-> sfp0 192.168.10.2.
; Management (MPM RPC): the 1 GbE ports, host 192.168.30.1 <-> eth0 192.168.30.2;
; DPDK takes over all traffic of its port, so the RPC needs another one.
; DPDK 24.11 or later: the DPDK 23.11 of Ubuntu 24.04 gives a ConnectX-4
; without DevX one receive descriptor (see rfsoc4x2_100g_udp/host/README.md).
; Hugepages before the first run, e.g. 3 GB of 2 MB pages:
;   echo 1536 | sudo tee /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages

[use_dpdk=1]
dpdk_mtu=9000
; Directory of the DPDK 24.11 poll mode drivers (mlx5)
dpdk_driver=/home/yijie/dpdk/lib/dpdk/pmds-25.0
; EAL cores: the first one is the main lcore, dpdk_lcore below is an I/O lcore
dpdk_corelist=2,3
dpdk_num_mbufs=8191
dpdk_mbuf_cache_size=64
dpdk_link_timeout=3000

; Host QSFP28 port (enp2s0np0)
[dpdk_mac=ec:0d:9a:44:d8:8c]
dpdk_lcore=3
dpdk_ipv4=192.168.10.1/24
dpdk_num_desc=4096
