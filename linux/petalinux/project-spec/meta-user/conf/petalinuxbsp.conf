#User Configuration

#OE_TERMINAL = "tmux"

# RFSoC 4x2 UHD image: MPM runtime and tools
IMAGE_INSTALL:append = " \
    python3 python3-modules python3-pyudev python3-grpcio python3-protobuf \
    python3-pyroute2 python3-netaddr python3-gevent python3-systemd \
    python3-zopeinterface python3-zope-event \
    python3-mako libgpiod libgpiod-tools libgpiod-python \
    boost libmetal libudev nftables ethtool iproute2 i2c-tools \
    openssh openssh-sftp-server dtc kernel-modules \
"
PACKAGECONFIG:append:pn-libgpiod = " python3"
IMAGE_FEATURES:remove = "ssh-server-dropbear"
# Free space in rootfs.ext4 (KB); tools/make_sd.sh grows the file system to the
# whole partition, so a small image is quicker to write to the card.
IMAGE_ROOTFS_EXTRA_SPACE = "262144"

# MPM: gRPC stubs need grpc_python_plugin from grpc-native
PACKAGECONFIG:append:pn-grpc-native = " python"
IMAGE_INSTALL:append = " usrp-mpm rfsoc4x2-fpga rfsoc4x2-net"
