# RFSoC 4x2 eth0 (GEM1, 1 GbE): a static management address next to the DHCP
# of the MPM eth0.network, for a direct cable to the host. UHD needs the
# management (RPC) traffic on a port that DPDK does not take over:
#   host 192.168.30.1/24 <-> board 192.168.30.2/24, mgmt_addr=192.168.30.2
[Network]
Address=192.168.30.2/24
