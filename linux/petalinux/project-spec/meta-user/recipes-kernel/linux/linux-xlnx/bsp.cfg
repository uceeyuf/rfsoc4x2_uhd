# RFSoC 4x2 UHD (MPM, X4xx style) kernel options

# Clock chips (LMK04828, 2x LMX2594) on PS SPI0
CONFIG_SPI_SPIDEV=y

# MPM register access: UIO nodes with compatible "usrp-uio"
# (bound by uio_pdrv_genirq.of_id=usrp-uio on the command line)
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_UIO_DMEM_GENIRQ=y

# FPGA image + device-tree overlay at runtime (MPM: configfs overlays)
CONFIG_OF_OVERLAY=y
CONFIG_OF_CONFIGFS=y
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQMP_FPGA=y
CONFIG_FPGA_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y

# NI XGE Ethernet (nixge): 100 GbE (sfp0) and the internal DMA port (int0)
CONFIG_NET_VENDOR_NI=y
CONFIG_NI_XGE_MANAGEMENT_ENET=y

# nftables (MPM transport manager)
CONFIG_NETFILTER=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_NETDEV=y
CONFIG_NFT_CT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
CONFIG_NFT_REDIR=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
